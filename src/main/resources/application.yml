server:
  port: ${PORT:8080}

spring:
  application:
    name: click-integration-demo
  datasource:
    url: jdbc:h2:mem:clickdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

click:
  service-id: 12345
  merchant-id: 67890
  secret-key: MY_CLICK_SECRET_KEY_12345
  merchant-user-id: 11111
  checkout-url: https://my.click.uz/services/pay
